{% extends 'trading/base.html' %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <div class="md:col-span-2 space-y-6">
        
        <div class="neon-border bg-black/50 p-6 rounded-sm">
            <h2 class="text-hackerRed text-xl mb-2">> MARKET_DATA: BTC/USD</h2>
            <div id="btc-price-display" 
                 class="text-6xl font-bold text-white terminal-text"
                 hx-get="/api/price-htmx/" 
                 hx-trigger="load, every 3s"
                 hx-swap="innerHTML">
                Loading...
            </div>
        </div>

        <div id="portfolio-section" class="neon-border bg-black/50 p-6 rounded-sm">
            {% include 'trading/partials/portfolio_partial.html' %}
        </div>
    </div>

    <div class="neon-border bg-black/50 p-6 rounded-sm">
        <h2 class="text-hackerRed text-xl mb-4">> EXECUTE_ORDER</h2>
        
        <form hx-post="/api/orders-htmx/" 
              hx-target="#order-message" 
              hx-swap="innerHTML">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div>
                   <label class="text-hackerRed text-sm">ASSET</label>
                   <input type="text" name="asset_code" value="BTC" readonly 
                          class="w-full bg-black border border-hackerRed text-white p-2 focus:outline-none focus:ring-1 focus:ring-hackerRed">
                </div>

                <div>
                    <label class="text-hackerRed text-sm">SIDE</label>
                    <select name="side" class="w-full bg-black border border-hackerRed text-white p-2 focus:outline-none">
                        <option value="BUY" class="bg-black">BUY (Long)</option>
                        <option value="SELL" class="bg-black">SELL (Short)</option>
                    </select>
                </div>

                 <div>
                    <label class="text-hackerRed text-sm">AMOUNT (BTC)</label>
                    <input type="number" step="0.00000001" name="amount" placeholder="0.0" required
                           class="w-full bg-black border border-hackerRed text-white p-2 focus:outline-none focus:ring-1 focus:ring-hackerRed">
                </div>

                 <div>
                    <label class="text-hackerRed text-sm">LIMIT PRICE (USD)</label>
                    <input type="number" step="0.01" name="price" placeholder="Current Price" required
                           class="w-full bg-black border border-hackerRed text-white p-2 focus:outline-none focus:ring-1 focus:ring-hackerRed">
                </div>
                
                <button type="submit" 
                        class="w-full bg-hackerRed/80 hover:bg-hackerRed text-black font-bold py-3 mt-6 neon-border transition-all active:scale-95">
                    [ EXECUTE TRANSACTION ]
                </button>
            </div>
        </form>

        <div id="order-message" class="mt-4 text-sm"></div>
    </div>
</div>
{% endblock %}
