<h3 class="text-hackerRed text-sm mb-2 mt-4 border-t border-hackerRed/30 pt-4">> MY_ACTIVE_ORDERS</h3>
<div class="overflow-y-auto max-h-40 border border-hackerRed/30 bg-black/40">
    <table class="w-full text-xs text-left">
        <thead class="bg-hackerRed/10 text-hackerRed sticky top-0">
            <tr>
                <th class="p-2">ASSET</th>
                <th class="p-2">SIDE</th>
                <th class="p-2">AMOUNT</th>
                <th class="p-2">PRICE</th>
                <th class="p-2">ACTION</th>
            </tr>
        </thead>
        <tbody class="text-gray-300">
            {% for order in orders %}
            <tr class="border-b border-gray-800 hover:bg-white/5">
                <td class="p-2 font-bold">{{ order.asset.code }}</td>
                <td class="p-2 {% if order.side == 'BUY' %}text-green-500{% else %}text-red-500{% endif %}">
                    {{ order.side }}
                </td>
                <td class="p-2">{{ order.initial_amount|floatformat:4 }}</td>
                <td class="p-2">${{ order.price|floatformat:2 }}</td>
                <td class="p-2">
                    <button 
                        hx-post="/api/cancel-order/{{ order.id }}/"
                        hx-target="#order-message"
                        class="text-red-500 border border-red-900 px-2 py-0.5 hover:bg-red-900/50 transition-colors text-[10px]">
                        [ X ] CANCEL
                    </button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="p-3 text-center text-gray-600 italic">> NO_ACTIVE_ORDERS</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
