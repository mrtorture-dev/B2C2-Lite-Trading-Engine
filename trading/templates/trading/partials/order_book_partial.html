<h3 class="text-hackerRed text-sm mb-2">> P2P_MARKET_DEPTH</h3>
<div class="overflow-y-auto max-h-60 border border-hackerRed/30">
    <table class="w-full text-xs text-left">
        <thead class="bg-hackerRed/20 text-hackerRed sticky top-0">
            <tr>
                <th class="p-2">USER</th>
                <th class="p-2">ASSET</th>
                <th class="p-2">SIDE</th>
                <th class="p-2">PRICE</th>
                <th class="p-2">ACTION</th>
            </tr>
        </thead>
        <tbody class="text-gray-300">
            {% for order in orders %}
            <tr class="border-b border-gray-800 hover:bg-white/5">
                <td class="p-2">{{ order.user.username }}</td>
                <td class="p-2 font-bold">{{ order.asset.code }}</td>
                <td class="p-2 {% if order.side == 'BUY' %}text-green-500{% else %}text-red-500{% endif %}">
                    {{ order.side }}
                </td>
                <td class="p-2">${{ order.price|floatformat:2 }}</td>
                <td class="p-2">
                    <button 
                        hx-post="/api/accept-order/{{ order.id }}/"
                        hx-target="#order-message"
                        class="bg-hackerRed text-black px-2 py-1 font-bold hover:bg-white transition-colors">
                        [ TAKE ]
                    </button>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="p-4 text-center text-gray-600">> BOOK_IS_EMPTY</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
