<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2C2 Lite Terminal</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        hackerRed: '#ff0033',
                        hackerDark: '#0a0a0a',
                    },
                    fontFamily: {
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
                    },
                    animation: {
                        'fill-bar': 'fill 2.5s ease-in-out forwards',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fill: {
                            '0%': { width: '0%' },
                            '100%': { width: '100%' },
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>

    <style>
        body {
            background-color: #050505;
            color: #e5e7eb;
        }
        .neon-border {
            box-shadow: 0 0 5px #ff0033, 0 0 10px #ff0033 inset;
            border: 1px solid #ff0033;
        }
        .terminal-text {
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #ff0033;
        }
        
        /* Loader Styles */
        #hacker-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999; /* Por encima de todo */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 0.5s ease-out;
        }
    </style>
</head>
<body class="bg-hackerDark text-gray-300 font-mono min-h-screen p-6">

    <div id="hacker-loader">
        <div class="mb-6 animate-pulse-fast">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-24 w-24 text-hackerRed" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2c-4.97 0-9 4.03-9 9 0 4.17 2.84 7.67 6.69 8.69L12 22l2.31-2.31C18.16 18.67 21 15.17 21 11c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 3.87-3.13 7-7 7s-7-3.13-7-7c0-3.87 3.13-7 7-7zm-3 5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm6 0c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1zm-3 3.5c-1.63 0-3.07.78-4 2 .35.25.75.43 1.18.52.88-.93 1.9-1.52 2.82-1.52.92 0 1.94.59 2.82 1.52.43-.09.83-.27 1.18-.52-.93-1.22-2.37-2-4-2z"/>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-white tracking-[0.2em] mb-2 terminal-text">
            SYSTEM_INITIALIZING...
        </h1>
        <div class="text-xs text-hackerRed mb-8">B2C2_LITE_ENGINE v1.0</div>

        <div class="w-64 h-2 border border-hackerRed rounded-sm p-[1px]">
            <div class="h-full bg-hackerRed animate-fill-bar shadow-[0_0_10px_#ff0033]"></div>
        </div>
        
        <div class="mt-2 text-xs text-gray-500 font-mono" id="loading-text">
            > Decrypting Wallets...
        </div>
    </div>

    <header class="mb-8 border-b border-hackerRed/50 pb-4 flex justify-between items-center">
        
        <h1 class="text-2xl md:text-3xl font-bold text-hackerRed terminal-text">
            > B2C2_LITE_TERMINAL v1.0
        </h1>

        <div class="flex items-center gap-4 text-xs md:text-sm font-mono">
            
            <div class="hidden md:block text-gray-400">
                USER: <span class="text-hackerRed font-bold">{{ user.username|upper }}</span>
            </div>

            <div class="text-hackerRed">
                 STATUS: <span class="animate-pulse text-green-500">ONLINE</span>
            </div>

            <a href="/admin/logout/?next=/" 
               class="border border-hackerRed text-hackerRed px-3 py-1 hover:bg-hackerRed hover:text-black transition-all font-bold">
                [ LOGOUT ]
            </a>
        </div>
    </header>
    
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        // Configuración HTMX CSRF
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
        });

        // 💀 LÓGICA DEL LOADER HACKER 💀
        window.addEventListener('load', function() {
            const loader = document.getElementById('hacker-loader');
            const loadingText = document.getElementById('loading-text');
            
            // Textos aleatorios estilo hacker para darle realismo
            const messages = [
                "> Connecting to Binance Node...",
                "> Fetching Liquidity Pools...",
                "> Verifying User Credentials...",
                "> Loading Assets..."
            ];

            let step = 0;
            const textInterval = setInterval(() => {
                if(step < messages.length) {
                    loadingText.innerText = messages[step];
                    step++;
                }
            }, 500); // Cambia texto cada 0.5s

            // Esperamos 2.5 segundos (tiempo suficiente para que HTMX cargue datos de fondo)
            setTimeout(function() {
                clearInterval(textInterval);
                loader.style.opacity = '0'; // Efecto desvanecimiento
                
                // Lo borramos del DOM para poder hacer clic en la página
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500); 
            }, 2500); // 2500 milisegundos = 2.5 segundos
        });
    </script>
</body>
</html>
